[project]
name = "cat-gifs"
version = "0.1.0"
description = "Dear ImGui Bundle app that shows random cat GIFs from cataas.com"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imgui-bundle>=1.92.900",
    "numpy>=1.24",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.scripts]
cat-gifs = "cat_gifs.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_gifs"]
