[project]
name = "dog-panel"
version = "0.1.0"
description = 'The "Dog" panel: a Dear ImGui Bundle panel showing random dog pictures'
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imgui-bundle>=1.92.900",
    "numpy>=1.24",
    "pillow>=10.0",
    "dog-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dog_panel"]
