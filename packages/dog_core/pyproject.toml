[project]
name = "dog-core"
version = "0.1.0"
description = "Native (C++) image procurement core for the Dog panel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dog_core"]

# hatchling is the PEP 517 backend, so `uv build` and `uv publish` work as for the
# pure-Python panels; the C++ part is compiled by Bazel from this hook (and the
# sources are packed into the sdist from there).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# Only relevant if something consumes this project as a path source: recompile
# the core only when its native sources or the build configuration change, not on
# every sync. The application consumes the prebuilt wheel instead.
cache-keys = [
    { file = "pyproject.toml" },
    { file = ".bazelversion" },
    { file = "BUILD.bazel" },
    { file = "MODULE.bazel" },
    { file = "hatch_build.py" },
    { file = "**/*.cpp" },
    { file = "**/*.hpp" },
    { file = "**/*.h" },
]
