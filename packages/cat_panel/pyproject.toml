[project]
name = "cat-panel"
version = "0.1.0"
description = 'The "Cat" panel: a Dear ImGui Bundle panel showing random animated cat GIFs'
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imgui-bundle>=1.92.900",
    "numpy>=1.24",
    "pillow>=10.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_panel"]
